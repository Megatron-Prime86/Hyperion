services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: hyperion
      POSTGRES_PASSWORD: hyperion
      POSTGRES_DB: hyperion
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U hyperion -d hyperion"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://hyperion:hyperion@postgres:5432/hyperion
      REDIS_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "true"
      LLM_PROVIDER: mock
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
