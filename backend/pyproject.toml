[project]
name = "hyperion"
version = "0.1.0"
description = "AI-powered alert triage and enrichment engine"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.165.0",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.4",
  "pydantic-settings==2.16.3",
  "sqlalchemy[asyncio]==2.1.9",
  "asyncpg==0.32.0",
  "aiosqlite==0.22.1",
  "celery==5.7.0",
  "redis==8.1.0",
  "httpx==0.28.1",
  "alembic==1.20.1",
  "pyjwt==2.15.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.2.0",
  "pytest-asyncio==1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
